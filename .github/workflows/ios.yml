name: Build iOS (unsigned)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DarkkitaHealth-unsigned-builds
          path: dist/*
